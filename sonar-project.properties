sonar.projectKey=latifkhanan_studyplan
sonar.organization=latifkhanan
sonar.projectName=studyplan
sonar.host.url=https://sonarcloud.io

# Flutter/Dart source and test scopes
sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Exclude generated and platform-specific build artifacts from Dart analysis
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/.dart_tool/**,**/build/**,**/android/**,**/ios/**,**/linux/**,**/macos/**,**/windows/**,**/web/**

# Flutter test coverage generated by `flutter test --coverage`
sonar.dart.lcov.reportPaths=coverage/lcov.info
