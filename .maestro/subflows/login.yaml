appId: com.example.studyplan
---
- extendedWaitUntil:
    visible: "Email"
    timeout: 15000
- tapOn:
    point: "50%, 41%"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    point: "50%, 52%"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    point: "50%, 66%"
- extendedWaitUntil:
    visible: "Beranda"
    timeout: 20000
