appId: com.example.studyplan
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Masuk ke StudyPlan"
    timeout: 10000
- tapOn: "Lupa kata sandi?"
- assertVisible: "Email Mahasiswa"
- tapOn: "nama@mahasiswa.ac.id"
- inputText: "bukan-email"
- tapOn: "Kirim Link Reset Kata Sandi"
- assertVisible: "Format email tidak valid"
